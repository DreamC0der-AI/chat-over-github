name = "chat-over-github"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The app's address. workers.dev is blocked in mainland China, so the app lives on chat-over-github.sunzy.app
# (Cloudflare custom domain). The old workers.dev address stays on: browsers keep their keys and
# messages per address, so people move over when they choose.
routes = [{ pattern = "chat-over-github.sunzy.app", custom_domain = true }]
workers_dev = true

# Before each deploy: copy the live site's current and recent builds into public/assets/, so pages
# loaded before the deploy keep finding their stylesheet and chunks (see keep-old-assets.mjs).
[build]
command = "node keep-old-assets.mjs"

# The chat web app (npm run build in the repo root writes it here). Files are served first; other paths reach the Worker.
[assets]
directory = "./public"

# Don't keep request logs: the Worker should not record who talks to whom.
[observability]
enabled = false

[vars]
GITHUB_CLIENT_ID = "Iv23liFOHVM634uq8c39"
# Comma-separated list of web origins allowed to call the Worker from a browser. Production only:
# `npm run dev` adds http://localhost:5173 for local work (see package.json), never the deployed Worker.
ALLOWED_ORIGINS = "https://chat-over-github.sunzy.app,https://chat-over-github.akagishigerutokyo.workers.dev"

# Keeps each token refresh's answer for 10 minutes ("rt:" keys, see src/index.js). Until
# 2026-11-17 it also held the invite inbox.
[[kv_namespaces]]
binding = "INVITES"
id = "f343b316d0984406897960fab255fb93"

# Secret (not in this file):  npx wrangler secret put GITHUB_CLIENT_SECRET

# Each user's invite inbox: one SQLite-backed Durable Object per GitHub user id.
[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Inbox"]

# Rate limits (Workers rate limiting binding; counted per Cloudflare location, approximate). The code skips a limit whose binding is missing. namespace_id is any number unique
# in the account.
# OAuth calls per client IP: sign-in and token refresh.
[[ratelimits]]
name = "OAUTH_LIMIT"
namespace_id = "7301"
simple = { limit = 60, period = 60 }

# Invite and closure posts per GitHub user (closing a chat posts one notice per member).
[[ratelimits]]
name = "INBOX_POST_LIMIT"
namespace_id = "7302"
simple = { limit = 100, period = 60 }
