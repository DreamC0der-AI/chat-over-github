name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      # The Worker isn't a workspace; its tests need its own wrangler.
      - run: npm ci --prefix worker
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Install the package first, then the browser build that exact version expects.
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium && npm run e2e
